name: CI - Build, Test & Push Docker image

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/entregable4-flask

jobs:
  test_in_docker:
    name: Tests inside Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      # Construye el target "test" (multi-stage) -> ejecuta pytest dentro del contenedor
      - name: Build test target (runs pytest)
        run: docker build --target test -t entregable4-test .

  push_image:
    name: Build & Push Docker image
    runs-on: ubuntu-latest
    needs: test_in_docker
    if: github.event_name == 'push'   # solo pushea cuando haces push (no en PR)
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
